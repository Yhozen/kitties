name: effect
on:
  pull_request:
  push:
    branches: [main, "effect/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: effect-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Effect · check · test · build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            coverage/
            test-results/
          retention-days: 14
      - run: pnpm build
      - run: pnpm --filter @kitties/kittyd check
