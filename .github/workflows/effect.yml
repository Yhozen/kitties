name: effect
on:
  pull_request:
  push:
    branches: [main, "effect/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: effect-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Effect · check · test · build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Local workflow recovery
        run: pnpm test:workflows
        timeout-minutes: 5
      - name: Local Library recovery and Home migration
        run: pnpm test:library
        timeout-minutes: 5
      - name: Local Library capture and retained archive recovery
        run: pnpm test:library-archive
        timeout-minutes: 5
      - name: Local Library capture-buffer cleanup and abandonment
        run: pnpm test:library-prune
        timeout-minutes: 5
      - name: Scheduled Library pruning and durable workflow replay
        run: pnpm test:library-prune-scheduled
        timeout-minutes: 5
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            coverage/
            test-results/
            .context/workflow-check/*/results.json
            .context/workflow-check/*/*.stderr.log
            .context/library-check/*/results.json
            .context/library-check/*/*.stderr.log
            .context/library-archive-check/*/results.json
            .context/library-archive-check/*/host-*.stderr.log
          include-hidden-files: true
          retention-days: 14
      - run: pnpm build
      - name: Compile every gateway export locally
        run: pnpm test:library-bundle
      - name: Shared production browser assets
        run: KITTIES_BROWSER=/usr/bin/google-chrome pnpm test:library-browser
        timeout-minutes: 5
      - name: Library browser reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: library-browser-reports
          path: |
            .context/library-browser-check/*/results.json
            .context/library-browser-check/*/*.png
            .context/library-gateway-bundles/results.json
          include-hidden-files: true
          retention-days: 14
      - run: pnpm --filter @kitties/kittyd check
