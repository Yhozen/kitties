name: effect
on:
  pull_request:
  push:
    branches: [main, "effect/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: effect-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Effect · check · test · build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Native desktop acceptance (Ubuntu / GTK / AT-SPI / voxl)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-3.0 at-spi2-core dbus-x11 xvfb openbox xdotool build-essential pkg-config clang libclang-dev libx264-dev libyuv-dev libopus-dev libpulse-dev
          rustup toolchain install 1.93.0 --profile minimal
          pnpm --filter @kitties/kittyd check
          pnpm --filter @kitties/kittyd build:voxl
          pnpm --filter @kitties/kittyd release
          sudo install -D guest/kittyd/dist/voxl /usr/local/lib/kittyd/voxl
          xvfb-run -a -s '-screen 0 1280x800x24' bun guest/kittyd/tests/video-native.ts
          cd guest/kittyd
          sh scripts/test-native.sh
