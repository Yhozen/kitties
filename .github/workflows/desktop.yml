name: desktop
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native build and test · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
      - name: Linux WebKit prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup default 1.99.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kitties/web build
      - run: cargo check --locked --tests --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build the actual desktop executable
        run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Native IPC and persistence tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
    # Native executables/tests are not packaged runtime, provider login or signing proof.
