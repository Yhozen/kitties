name: desktop
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native build and test · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
      - name: Linux WebKit prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup default 1.99.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kitties/web build
      - run: cargo check --locked --tests --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build the actual desktop executable
        run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Native IPC and persistence tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Inspect Windows loader failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .context/native-loader | Out-Null
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          Get-ChildItem apps/desktop/src-tauri/target/debug/deps/kitties_desktop-*.exe | ForEach-Object {
            & $dumpbin.FullName /imports $_.FullName | Out-File ".context/native-loader/$($_.Name).imports.txt"
          }
          Get-ChildItem apps/desktop/src-tauri/target/debug -Recurse -Include *.dll | Get-FileHash | Format-List | Out-File .context/native-loader/dll-hashes.txt
      - name: Windows loader artifacts
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-native-loader
          path: |
            .context/native-loader/
            apps/desktop/src-tauri/target/debug/deps/kitties_desktop-*.exe
            apps/desktop/src-tauri/target/debug/*.dll
            apps/desktop/src-tauri/target/debug/deps/*.dll
          include-hidden-files: true
          retention-days: 14
    # Native executables/tests are not packaged runtime, provider login or signing proof.
