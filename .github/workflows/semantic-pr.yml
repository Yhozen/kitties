name: semantic pr

# Use a conventional commit title for a readable squash-merge history.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: semantic title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: the title is a semantic commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert'
          if printf '%s' "$TITLE" | grep -qE "^($types)(\([a-z0-9./_ -]+\))?!?: .+"; then
            echo "ok: $TITLE"
          else
            echo "::error::The title \"$TITLE\" is not a semantic commit: write it as type(scope): what, with type one of ${types//|/, } (and ! before the colon for a breaking change)."
            exit 1
          fi
