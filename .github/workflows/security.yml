name: security

# What could hurt a person who runs Kitties: known flaws in what it is built from, secrets that
# slipped into the history, and the code's own mistakes. It runs on every push and pull request,
# and once a week, because a flaw can be published about something that was clean yesterday.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pnpm-audit:
    name: application dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  # A secret in the code or in its history is a secret for everyone who can read it.
  secrets:
    name: secrets in the history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Subtree imports add parentless commits; use the known base for the action's range.
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      # The action uses --first-parent --no-merges. Also scan every reachable commit,
      # including the subtree's imported root and branches brought in by merges.
      - name: Scan complete history
        run: gitleaks git --redact --log-opts="--root HEAD" --report-format=sarif --report-path=full-history.sarif
      - name: Complete history report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-full-history
          path: full-history.sarif
          retention-days: 14

  # The code's own mistakes (injection, unsafe paths, weak crypto), with GitHub's CodeQL.
  codeql:
    # Private repositories need a GitHub Code Security licence; opt in after enabling it.
    if: github.event.repository.private == false || vars.ENABLE_CODEQL == 'true'
    name: codeql · ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # Guest shell scripts are shipped in the immutable Boat release.
  shellcheck:
    name: shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck --severity=warning guest/desktop/*.sh guest/desktop/files/*.sh guest/kittyd/files/*.sh
