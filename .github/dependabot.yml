version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      workspace:
        patterns: ["*"]
    # Effect/Alchemy upgrades require the cloud workflow acceptance suite.
    ignore:
      - dependency-name: "effect"
      - dependency-name: "@effect/*"
      - dependency-name: "alchemy"
      - dependency-name: "@alchemy.run/*"
    commit-message:
      prefix: "chore(deps)"
