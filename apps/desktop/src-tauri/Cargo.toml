[package]
name = "kitties-desktop"
version = "0.1.0"
description = "Kitties shared Library desktop host"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "kitties_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", default-features = false }

[dependencies]
tauri = { version = "=2.12.5" }
tauri-plugin-store = "=2.5.0"
# Cookies/tracing/system proxy defaults are deliberately absent: credentials stay ephemeral.
tauri-plugin-http = { version = "=2.8.3", default-features = false, features = [
  "rustls-tls-native-roots",
  "http2",
  "json",
] }
tauri-plugin-opener = "=2.7.2"
tokio = { version = "=1.54.1", features = ["net", "io-util", "time", "sync", "macros"] }
url = "=2.5.8"
getrandom = "=0.3.4"
base64 = "=0.22.1"
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }
tauri = { version = "=2.12.5", default-features = false, features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
